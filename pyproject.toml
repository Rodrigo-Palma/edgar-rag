[project]
name = "edgar-rag"
version = "0.1.0"
description = "Question answering over SEC filings that cites its sources and abstains when the evidence is thin"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.1",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.2",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["edgar_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "edgar_rag"

[[tool.importlinter.contracts]]
name = "Nothing imports the service entry point"
type = "forbidden"
source_modules = [
    "edgar_rag.answer",
    "edgar_rag.chunking",
    "edgar_rag.config",
    "edgar_rag.edgar",
    "edgar_rag.models",
    "edgar_rag.gate",
    "edgar_rag.index",
    "edgar_rag.telemetry",
]
forbidden_modules = ["edgar_rag.service"]

[[tool.importlinter.contracts]]
name = "Only the entry point reads configuration"
type = "forbidden"
source_modules = [
    "edgar_rag.answer",
    "edgar_rag.chunking",
    "edgar_rag.edgar",
    "edgar_rag.models",
    "edgar_rag.gate",
    "edgar_rag.index",
    "edgar_rag.telemetry",
]
forbidden_modules = ["edgar_rag.config"]

[[tool.importlinter.contracts]]
name = "Telemetry is a leaf: it measures and logs, and knows no stage"
type = "forbidden"
source_modules = ["edgar_rag.telemetry"]
forbidden_modules = [
    "edgar_rag.answer",
    "edgar_rag.chunking",
    "edgar_rag.edgar",
    "edgar_rag.models",
    "edgar_rag.eval",
    "edgar_rag.gate",
    "edgar_rag.index",
]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on the answering core"
type = "forbidden"
source_modules = [
    "edgar_rag.chunking",
    "edgar_rag.edgar",
    "edgar_rag.models",
    "edgar_rag.gate",
    "edgar_rag.index",
]
forbidden_modules = ["edgar_rag.answer"]

[[tool.importlinter.contracts]]
name = "The EDGAR client and parser stand alone"
type = "forbidden"
source_modules = ["edgar_rag.edgar"]
forbidden_modules = [
    "edgar_rag.chunking",
    "edgar_rag.models",
    "edgar_rag.gate",
    "edgar_rag.index",
]

[[tool.importlinter.contracts]]
name = "Evaluation statistics are pure: no I/O layer, model or service"
type = "forbidden"
source_modules = [
    "edgar_rag.eval.bootstrap",
    "edgar_rag.eval.metrics",
    "edgar_rag.eval.numeric",
    "edgar_rag.eval.power",
]
forbidden_modules = [
    "edgar_rag.answer",
    "edgar_rag.service",
    "edgar_rag.chunking",
    "edgar_rag.config",
    "edgar_rag.edgar",
    "edgar_rag.models",
    "edgar_rag.gate",
    "edgar_rag.index",
]
