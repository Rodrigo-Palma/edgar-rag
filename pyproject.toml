[project]
name = "edgar-rag"
version = "0.1.0"
description = "Question answering over SEC filings that cites its sources and abstains when the evidence is thin"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.1",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.2",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.scripts]
edgar-rag = "edgar_rag.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["edgar_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "edgar_rag"

# Top to bottom: a module may import from the layers below it, never above.
# Modules joined by "|" share a layer and may not import each other.
[[tool.importlinter.contracts]]
name = "Layers: entry points, then the pipeline, then adapters, then the domain"
type = "layers"
layers = [
    "edgar_rag.cli",
    "edgar_rag.service | edgar_rag.eval",
    "edgar_rag.ingest | edgar_rag.answer | edgar_rag.config",
    "edgar_rag.prompt | edgar_rag.citations",
    "edgar_rag.chunking | edgar_rag.gate | edgar_rag.index | edgar_rag.models | edgar_rag.period",
    "edgar_rag.edgar | edgar_rag.telemetry | edgar_rag.amounts",
    "edgar_rag.domain",
]

[[tool.importlinter.contracts]]
name = "The answering core sees adapters only through the ports in domain"
type = "forbidden"
source_modules = ["edgar_rag.answer", "edgar_rag.prompt", "edgar_rag.citations"]
forbidden_modules = [
    "edgar_rag.chunking",
    "edgar_rag.config",
    "edgar_rag.edgar",
    "edgar_rag.gate",
    "edgar_rag.index",
    "edgar_rag.models",
    "edgar_rag.period",
]

[[tool.importlinter.contracts]]
name = "Evaluation statistics are pure: no I/O layer, model or service"
type = "forbidden"
source_modules = [
    "edgar_rag.eval.bootstrap",
    "edgar_rag.eval.metrics",
    "edgar_rag.eval.numeric",
    "edgar_rag.eval.power",
    "edgar_rag.amounts",
]
forbidden_modules = [
    "edgar_rag.answer",
    "edgar_rag.chunking",
    "edgar_rag.config",
    "edgar_rag.edgar",
    "edgar_rag.gate",
    "edgar_rag.index",
    "edgar_rag.ingest",
    "edgar_rag.models",
    "edgar_rag.service",
]
