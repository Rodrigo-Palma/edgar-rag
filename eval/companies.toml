# Companies of the golden set, by ticker. The build checks every CIK against the
# SEC's company_tickers.json snapshot and fails on any difference.
#
# A company is pinned to its two 10-Ks for the fiscal years below. When one of
# them is missing under the listed CIK, or its report date falls in another
# calendar year than its fiscal year, the company is excluded and the next
# reserve takes its place in the same split. Exclusions are recorded in
# eval/filings.lock.json.
#
# XOM: company_tickers.json maps the ticker to ExxonMobil Holdings Corp
# (CIK 2115436), a new registrant with no 10-K; the CIK is listed as the SEC
# lists it, so the rule above decides.

fiscal_years = [2024, 2025]
fold_seed = 20261001
sample_seed = 20261001

[[company]]
ticker = "AAPL"
cik = 320193
name = "Apple"
split = "dev"

