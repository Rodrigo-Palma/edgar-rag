name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint

  typecheck:
    name: types and import contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make typecheck
      - run: make imports

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tests load the committed CI index and tape.
      - uses: ./.github/actions/lfs
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make test

  eval:
    name: eval gate (dev split replayed, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lfs
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The verdict goes to the job summary; workflow commands (::warning::)
      # go to the log, where the runner turns them into annotations.
      - name: replay the dev split and judge it against eval/ci/baseline.json
        shell: bash
        run: |
          set +e
          make eval-ci > "$RUNNER_TEMP/eval-ci.md"
          status=$?
          cat "$RUNNER_TEMP/eval-ci.md"
          grep -v '^::' "$RUNNER_TEMP/eval-ci.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: make demo answers one question and declines the other without a model
        run: make demo

  report:
    name: report reproduces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # Reports are built from the frozen runs' records, which are plain git.
      - name: rebuild docs/eval from the frozen runs
        shell: bash
        run: |
          make eval | tee "$RUNNER_TEMP/eval.out"
          if grep -q '^no frozen run' "$RUNNER_TEMP/eval.out"; then
            echo "::notice title=report::no frozen run in eval/runs/ yet, so there is no report to reproduce until the headline round"
          fi
      - name: docs/eval matches what the frozen runs produce
        run: |
          git status --porcelain docs/eval
          test -z "$(git status --porcelain docs/eval)"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: make audit

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built and started here, never pushed: there is no registry.
      - run: docker build -t edgar-rag:ci .
      - name: runs as a non-root user
        run: test "$(docker image inspect edgar-rag:ci --format '{{.Config.User}}')" = "edgar:edgar"
      - name: starts and answers /health without an index or Ollama
        run: |
          docker run --detach --name edgar-rag --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL edgar-rag:ci
          for _ in $(seq 1 30); do
            if body=$(curl --silent --fail localhost:8000/health); then break; fi
            sleep 1
          done
          echo "$body"
          python3 -c 'import json, sys; h = json.loads(sys.argv[1]); assert h["status"] == "no index" and h["ollama_reachable"] is False, h' "$body"
      - name: image size
        if: always()
        run: |
          size=$(docker run --rm --entrypoint sh edgar-rag:ci -c 'du -sxh / 2>/dev/null' | cut -f1)
          echo "image filesystem: $size" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: container log
        if: failure()
        run: docker logs edgar-rag
