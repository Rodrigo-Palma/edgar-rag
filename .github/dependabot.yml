version: 2
updates:
  # uv.lock is read by the "uv" ecosystem; "pip" would only see pyproject.toml
  # and propose ranges the lockfile never picks up.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # The base images in the Dockerfile, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
